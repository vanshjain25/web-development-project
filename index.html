<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student expense tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <h1>Student Expense Tracker</h1>
      <div class="form-box">
        <input type="text" id="expenseName" placeholder="Expense name">
      <input type="number" id="expenseAmount" placeholder="Amount">

      <select id="expenseCategory">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>
      <button id="addBtn">Add Expense</button>
      <p id="errorMsg"></p>
    </div>

    <!-- Category filter -->
    <div class="filter-box">
      <label for="filterCategory">Filter by category:</label>
      <select id="filterCategory">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Shopping">Shopping</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>
    </div>
<!-- Totals -->
    <div class="total-box">
      <h2>Total Expenses: &#8377;<span id="totalAll">0</span></h2>
      <p>Total of shown expenses: &#8377;<span id="totalShown">0</span></p>
    </div>

    <!-- List of expenses -->
    <h3>Your Expenses: </h3>
    <ul id="expenseList"></ul>
  </div>

  <script src="code.js"></script>
</body>
</html>
